name: Build AI Future Persian Motion Graphic

on:
  push:
    branches: [main]
    paths:
      - "video-requests/ai-future-fa.json"
      - ".github/workflows/build-ai-future-fa.yml"
      - "scripts/produce.mjs"
      - "src/production/**"
      - "tests/**"
      - "prompt-library/prompts.json"
      - "docs/AUDIO_PRODUCTION_PIPELINE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-future-fa-motion-graphic
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MOTION_TOPIC: "آینده هوش مصنوعی؛ فناوری‌ای که جهان را تغییر می‌دهد"
      MOTION_STUDIO_LANGUAGE: "fa"
      MOTION_STUDIO_DURATION: "60"
      MOTION_STUDIO_STYLE: "auto"
      MOTION_STUDIO_PROMPT_RECIPE: "cinematic-science-cutaway"
      MOTION_STUDIO_MUSIC_ENGINE: "auto"
      ACESTEP_API_URL: ${{ secrets.ACESTEP_API_URL }}
      ACESTEP_API_KEY: ${{ secrets.ACESTEP_API_KEY }}
      MOTION_STUDIO_ASPECT_RATIO: "16:9"
      MOTION_STUDIO_VOICE: "edge-tts"
      MOTION_STUDIO_EDGE_VOICE: "fa-IR-FaridNeural"
      MOTION_STUDIO_EDGE_RATE: "+5%"
      MOTION_STUDIO_EDGE_PITCH: "+0Hz"
      MOTION_STUDIO_EDGE_VOLUME: "+0%"
      MOTION_STUDIO_ALLOW_PAID_API: "false"
    steps:
      - name: Check out the GitHub project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python for Persian narration
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Persian speech engine
        run: python -m pip install --no-cache-dir persian-speech==1.1.3 edge-tts==7.3.1
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation2 fonts-noto-core
      - name: Validate project and tests
        run: npm run validate
      - name: Ensure Remotion browser
        run: npx remotion browser ensure
      - name: Produce and render with the repository engine
        run: npm run produce -- --topic "$MOTION_TOPIC" --language "$MOTION_STUDIO_LANGUAGE" --duration "$MOTION_STUDIO_DURATION" --style "$MOTION_STUDIO_STYLE" --aspect-ratio "$MOTION_STUDIO_ASPECT_RATIO" --voice "$MOTION_STUDIO_VOICE" --prompt-recipe "$MOTION_STUDIO_PROMPT_RECIPE" --music-engine "$MOTION_STUDIO_MUSIC_ENGINE"
      - name: Generate artifact integrity checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          roots=(out)
          if [[ -d public/generated ]]; then roots+=(public/generated); fi
          find "${roots[@]}" -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
      - name: Upload rendered video and production reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-future-persian-motion-graphic-${{ github.run_id }}
          path: |
            out/**
            public/generated/**
            SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
