name: Motion Studio Production
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic or creative brief"
        required: true
        type: string
      language:
        description: "Narration and caption language"
        required: true
        type: choice
        options: [fa, en, de, es, fr, it, pt, nl]
        default: fa
      duration:
        description: "Target duration in seconds (5-600)"
        required: true
        type: number
        default: 90
      style:
        description: "Visual style preset"
        required: true
        type: choice
        options: [auto, cinematic-documentary, scientific-2-5d, data-journalism, editorial-kinetic-type, premium-3d-product, tactile-collage, swiss-modernist, procedural-generative, vertical-social]
        default: auto
      aspect_ratio:
        description: "Output frame"
        required: true
        type: choice
        options: ["16:9", "9:16", "1:1"]
        default: "16:9"
      voice:
        description: "Narration engine"
        required: true
        type: choice
        options: [edge-tts, auto, off]
        default: edge-tts
      opus55_reference:
        description: "Optional Opus 5.5 reference slug"
        required: false
        type: string
      music_engine:
        description: "Procedural is local; ACE-Step needs a self-hosted API URL and optional server auth key"
        required: true
        type: choice
        options: [procedural, auto, ace-step]
        default: procedural
      prompt_recipe:
        description: "Recipe ID from the validated 96-entry prompt catalog"
        required: true
        type: string
        default: cinematic-science-cutaway
      plan_only:
        description: "Create storyboard and manifests without rendering an MP4; paid AI may still incur API charges if enabled"
        required: true
        type: boolean
        default: false
      use_ai:
        description: "Allow paid Anthropic API usage when ANTHROPIC_API_KEY is configured"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: motion-studio-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install system render tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-core fonts-noto-cjk
      - name: Set up Python for neural voice
        if: ${{ inputs.voice == 'edge-tts' && !inputs.plan_only }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural voice engine
        if: ${{ inputs.voice == 'edge-tts' && !inputs.plan_only }}
        run: python -m pip install --disable-pip-version-check edge-tts==7.3.1
      - name: Set up Python for local narration
        if: ${{ inputs.voice == 'auto' && !inputs.plan_only }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local Persian narration engine
        if: ${{ inputs.voice == 'auto' && inputs.language == 'fa' && !inputs.plan_only }}
        run: python -m pip install --disable-pip-version-check persian-speech==1.1.3
      - name: Install Pocket TTS for supported non-Persian languages
        if: ${{ inputs.voice == 'auto' && inputs.language != 'fa' && !inputs.plan_only }}
        run: python -m pip install --disable-pip-version-check pocket-tts
      - name: Install project dependencies
        run: npm ci
      - name: Validate browser UI syntax
        run: node --check site/app.js
      - name: Validate project
        run: npm run validate
      - name: Prepare Remotion browser
        if: ${{ !inputs.plan_only }}
        run: npx remotion browser ensure
      - name: Produce video or plan-only deliverables
        env:
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          DURATION: ${{ inputs.duration }}
          STYLE: ${{ inputs.style }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          VOICE: ${{ inputs.voice }}
          OPUS55_REFERENCE: ${{ inputs.opus55_reference }}
          MUSIC_ENGINE: ${{ inputs.music_engine }}
          PROMPT_RECIPE: ${{ inputs.prompt_recipe }}
          PLAN_ONLY: ${{ inputs.plan_only }}
          ACESTEP_API_URL: ${{ secrets.ACESTEP_API_URL }}
          ACESTEP_API_KEY: ${{ secrets.ACESTEP_API_KEY }}
          USE_AI: ${{ inputs.use_ai }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]] || (( DURATION < 5 || DURATION > 600 )); then
            echo "::error::Duration must be between 5 and 600 seconds."
            exit 2
          fi
          effective_voice="$VOICE"
          if [[ "$PLAN_ONLY" == "true" ]]; then
            effective_voice="off"
          fi
          args=(--topic "$TOPIC" --language "$LANGUAGE" --duration "$DURATION" --style "$STYLE" --aspect-ratio "$ASPECT_RATIO" --voice "$effective_voice" --music-engine "$MUSIC_ENGINE" --prompt-recipe "$PROMPT_RECIPE" --output-dir "out/run-${GITHUB_RUN_ID}")
          if [[ -n "${OPUS55_REFERENCE//[[:space:]]/}" ]]; then
            args+=(--opus55-reference "$OPUS55_REFERENCE")
          fi
          if [[ "$PLAN_ONLY" == "true" ]]; then
            args+=(--plan-only)
            echo "Plan-only mode: no MP4 render or narration engine setup will run."
          fi
          if [[ "$PLAN_ONLY" != "true" && "$MUSIC_ENGINE" == "ace-step" && -z "${ACESTEP_API_URL:-}" ]]; then
            echo "::error::ACE-Step was selected but ACESTEP_API_URL is missing from repository Actions Secrets."
            exit 2
          fi
          if [[ "$USE_AI" == "true" ]]; then
            if [[ -n "${ANTHROPIC_API_KEY:-}" ]]; then
              args+=(--allow-paid-ai)
            else
              echo "::warning::ANTHROPIC_API_KEY is not configured. The engine will use its local fallback."
            fi
          else
            echo "Paid AI disabled by default; the local storyboard fallback will be used."
          fi
          npm run produce -- "${args[@]}"
      - name: Generate artifact integrity checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="out/run-${GITHUB_RUN_ID}"
          mkdir -p "$artifact_dir"
          (
            cd "$artifact_dir"
            find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          )
      - name: Upload video, captions and production reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-studio-output-${{ github.run_id }}
          path: |
            out/run-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
