name: Validate Motion Graphics Studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-render:
    name: Validate Skills, CLI and Remotion Rendering
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Validate browser studio and catalog sync syntax
        run: |
          node --check site/app.js
          node --check site/brief-commands.mjs
          node --check scripts/sync-site-prompt-catalog.mjs
      - name: Validate skills and production engine
        run: npm run validate
      - name: Install media tools and readable system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation2 fonts-noto-core
      - name: Syntax-check and exercise the production CLI
        run: |
          node --check scripts/produce.mjs
          node --check site/brief-commands.mjs
          node --input-type=module --check < site/app.js
          npm run produce -- --topic "CLI orchestration regression" --language en --duration 20 --style auto --aspect-ratio 16:9 --voice off --plan-only
      - name: Ensure Remotion browser
        run: npx remotion browser ensure
      - name: Produce and technically verify an end-to-end video
        run: |
          npm run produce -- --topic "How heat moves through a city" --language en --duration 12 --style scientific-2-5d --aspect-ratio 16:9 --voice off --output-dir out/e2e
          node -e 'const fs=require("node:fs");const path=require("node:path");const runs=fs.readdirSync("out/e2e",{withFileTypes:true}).filter(e=>e.isDirectory()).map(e=>e.name);if(runs.length!==1)throw new Error("Expected exactly one end-to-end run folder, found "+runs.length);const report=JSON.parse(fs.readFileSync(path.join("out/e2e",runs[0],"qc-report.json"),"utf8"));if(report.status!=="TECHNICAL_PASS_CREATIVE_REVIEW_PENDING")throw new Error("Expected technical QC pass, got "+report.status);console.log("End-to-end MP4 passed technical QC; creative/audio review remains explicitly pending.");'
      - name: Prepare render directory
        run: mkdir -p out
      - name: Render generic smoke test
        run: npm run render:demo
      - name: Render data-driven production composition
        run: npm run render:smoke
      - name: Verify both MP4 files
        run: |
          set -e
          for file in out/motion-demo.mp4 out/motion-video-smoke.mp4; do
            test -s "$file"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 "$file"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$file"
          done
      - name: Upload render proof
        uses: actions/upload-artifact@v7
        with:
          name: motion-studio-smoke-renders
          path: |
            out/*.mp4
            out/e2e/**
          if-no-files-found: error
          retention-days: 7
