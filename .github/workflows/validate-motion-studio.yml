name: Validate Motion Graphics Studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    name: Validate Agent Skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate skill files and catalogue
        run: node scripts/validate-skills.mjs

  render-smoke-test:
    name: Render sample MP4 with Remotion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure Remotion browser
        run: npx remotion browser ensure
      - name: Render sample video
        run: npx remotion render src/index.ts MotionDemo out/motion-demo.mp4 --codec=h264
      - name: Verify rendered MP4
        run: |
          test -s out/motion-demo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 out/motion-demo.mp4
      - name: Upload render proof
        uses: actions/upload-artifact@v4
        with:
          name: motion-studio-smoke-render
          path: out/motion-demo.mp4
          if-no-files-found: error
          retention-days: 7
